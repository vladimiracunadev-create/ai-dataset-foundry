name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - run: cd dist && sha256sum * > SHA256SUMS-python.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --extra desktop --extra release --locked
      - run: uv run pyinstaller --noconfirm --clean --onefile --windowed --name AI-Dataset-Foundry-Windows --collect-data ai_dataset_foundry --collect-all webview launcher.py
      - shell: pwsh
        run: (Get-FileHash dist/AI-Dataset-Foundry-Windows.exe -Algorithm SHA256).Hash.ToLower() + "  AI-Dataset-Foundry-Windows.exe" | Set-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-desktop
          path: |
            dist/AI-Dataset-Foundry-Windows.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
        with:
          gradle-version: "8.9"
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug
      - run: |
          mkdir release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/AI-Dataset-Foundry-Android-demo.apk
          cd release-android && sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-demo
          path: release-android/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, windows-desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
